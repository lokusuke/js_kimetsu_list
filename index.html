<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/animation.css" />
    <title>鬼滅の刃キャラクター</title>
  </head>
  <body>
    <main>
      <h1>鬼滅の刃キャラクター検索</h1>
      <!-- loading画面表示 -->
      <div class="loading">
        <p class="loading-text">Loading...</p>
        <!-- https://projects.lukehaas.me/css-loaders/ からアニメーション取得 -->
        <div class="loader"></div>
      </div>

      <div class="character-list" id="character-list">
        <div class="character">
          <p class="name">竈門 炭治郎</p>
          <p class="role">鬼殺隊</p>
        </div>
        <div class="character">
          <p class="name">我妻 善逸</p>
          <p class="role">鬼殺隊</p>
        </div>
        <div class="character">
          <p class="name">煉獄 杏寿郎</p>
          <p class="role">柱</p>
        </div>
        <div class="character">
          <p class="name">猗窩座</p>
          <p class="role">鬼</p>
        </div>
        <!-- Todo: ここにidで識別したElementを作成する
       イベントリスナーでラジオボタンの種類に応じた処理がJSで動的に埋め込む -->
      </div>
    </main>
    <aside>
      <!-- aside: ページ側面にラジオボタンを配置 -->
      <div class="character-filter">
        <label
          ><input
            type="radio"
            name="character-category"
            value="all-characters"
            checked
          />全キャラクター</label
        >
        <label
          ><input
            type="radio"
            name="character-category"
            value="demon-hunters"
          />鬼殺隊</label
        >
        <label
          ><input
            type="radio"
            name="character-category"
            value="pillars"
          />柱</label
        >
        <label
          ><input
            type="radio"
            name="character-category"
            value="demons"
          />鬼</label
        >
      </div>
    </aside>
    <script src="js/index.js"></script>
  </body>
</html>
