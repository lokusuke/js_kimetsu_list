<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鬼滅の刃キャラクター一覧</title>
  </head>
  <body>
    <h1>鬼滅の刃キャラクター一覧</h1>
    <div class="character-filter">
      <label
        ><input
          type="radio"
          name="character-category"
          value="all-characters"
        />全キャラクター</label
      >
      <label
        ><input
          type="radio"
          name="character-category"
          value="demon-hunters"
        />鬼殺隊</label
      >
      <label
        ><input
          type="radio"
          name="character-category"
          value="pillars"
        />柱</label
      >
      <label
        ><input
          type="radio"
          name="character-category"
          value="demons"
        />鬼</label
      >
    </div>
    <div class="character-container" id="character-list">
      <!-- Todo: ここにidで識別したElementを作成する
       イベントリスナーでラジオボタンの種類に応じた処理がJSで動的に埋め込む -->
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
